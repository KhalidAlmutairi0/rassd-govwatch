[phases.setup]
nixPkgs = [
  "nodejs_20",
  "chromium",
  "nss",
  "freetype",
  "harfbuzz",
  "ca-certificates",
  "ttf-dejavu",
]

[phases.install]
cmds = [
  "npm ci",
  "npx prisma generate",
  "npx playwright install --with-deps chromium || true",
  "echo \"--- Chromium search ---\" && which chromium 2>/dev/null || true && find /nix/store -maxdepth 4 -path '*/bin/chromium' 2>/dev/null | head -3 || true",
]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "chmod +x start.sh && ./start.sh"
