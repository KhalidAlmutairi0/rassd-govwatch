[phases.setup]
nixPkgs = [
  "nodejs_20",
  "chromium",
  "nss",
  "freetype",
  "harfbuzz",
  "ca-certificates",
  "ttf-dejavu",
]

[phases.install]
cmds = [
  "npm ci",
  "npx prisma generate",
]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "chmod +x start.sh && ./start.sh"

[phases.setup.variables]
PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"
