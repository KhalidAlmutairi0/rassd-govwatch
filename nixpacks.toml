[phases.setup]
nixPkgs = [
  "nodejs_20",
  "nss",
  "freetype",
  "harfbuzz",
  "ca-certificates",
  "ttf-dejavu",
  "glib",
  "gtk3",
  "mesa",
  "xorg.libX11",
  "xorg.libXcomposite",
  "xorg.libXdamage",
  "xorg.libXext",
  "xorg.libXfixes",
  "xorg.libXrandr",
  "xorg.libxcb",
  "xorg.libxshmfence",
  "alsa-lib",
  "at-spi2-atk",
  "cups",
  "dbus",
  "expat",
  "libdrm",
  "libxkbcommon",
  "pango",
  "nspr",
]

[phases.install]
cmds = [
  "npm ci",
  "npx prisma generate",
  "npx playwright install chromium",
  "echo '--- Playwright Chromium path ---' && node -e \"const{chromium}=require('playwright');console.log(chromium.executablePath())\"",
]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "chmod +x start.sh && ./start.sh"
